[project]
name = "pagerzero"
version = "0.1.0"
description = "Autonomous incident response agent — 5 parallel LLM agents on AMD MI300X"
readme = "README.md"
authors = [
    { name = "Youssef Madkour", email = "madkour.youssef@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langgraph>=1.1.10",
    "openai>=2.33.0",
    "pydantic>=2.13.3",
    "sse-starlette>=3.4.1",
    "uvicorn>=0.46.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
